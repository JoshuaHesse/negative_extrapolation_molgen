[project]
name = "negative-extrapolation-molgen"
version = "0.1.0"
description = "Negative extrapolation for targeted liability erasure in molecular generators"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "rdkit>=2026.3,<2027",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "torch>=2.5,<3",
    "tqdm>=4.66,<5",
    "mlflow>=3.15,<4",
    "fcd_torch==1.0.7",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.3",
    "pytest==9.1.1",
]
figures = [
    "ipykernel==6.29.4",
    "nbconvert==7.16.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
